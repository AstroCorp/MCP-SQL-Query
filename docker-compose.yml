# Misma base app en los tres motores. tests arranca cuando ya responden.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: app
    ports:
      - "53306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/db/mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-uroot", "-ppassword", "-e", "SELECT 1 FROM app.accounts LIMIT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: app
    ports:
      - "53307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/db/mysql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mariadb", "-h", "127.0.0.1", "-uroot", "-ppassword", "-e", "SELECT 1 FROM app.accounts LIMIT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/db/postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app && psql -U postgres -d app -c 'SELECT 1 FROM accounts LIMIT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  tests:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./docker/connections.json:/app/connections.json:ro

volumes:
  mysql-data:
  mariadb-data:
  postgres-data:
